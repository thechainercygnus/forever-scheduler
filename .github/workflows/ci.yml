name: ci

on:
  push:
    branches: [main, "release/**"]
  pull_request:

# Least privilege: read-only by default; a job that needs more says so itself.
# Actions are pinned to commit SHAs with the version in a comment; Dependabot updates both.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      # Coverage: fails below the floor in pyproject.toml.
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
      # Shown even when the floor fails the step above.
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        run: |
          uv run python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          lines, branches = float(root.get("line-rate")), float(root.get("branch-rate"))
          print("### Coverage")
          print()
          print(f"Statements **{lines:.1%}**, branches **{branches:.1%}**.")
          EOF
          {
            echo "<details><summary>Per file</summary>"
            echo
            uv run coverage report --format=markdown
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists a pull request's commits to scan them; without this it
      # fails on every PR with "Resource not accessible by integration".
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
