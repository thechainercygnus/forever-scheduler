[project]
name = "forever-scheduler"
version = "0.0.1"
description = "A Discord bot for scheduling WoW Forever dungeon and raid groups, linked to the Character Planner."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "hikari>=2.7.0",
    "hikari-arc>=2.3.2",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
forever-scheduler = "forever_scheduler.bot:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "pyright>=1.1.414",
    "pre-commit>=4.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forever_scheduler"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "S",   # bandit (security)
    "RUF",
]
ignore = ["S101"] # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"] # fake secrets in tests

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
strict = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Every warning fails the run. Ignore one only when it comes from a dependency and can't
# be fixed here, with a comment saying why.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/forever_scheduler"]
branch = true

[tool.coverage.report]
skip_empty = true
precision = 1
# Raise as coverage grows; never lower it to pass.
fail_under = 80
