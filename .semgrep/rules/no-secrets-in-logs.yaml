# CLAUDE.md: "Never log or print the Discord token or the planner token."
# A taint rule: a secret must not reach a log call, print, an exception's message, or a
# message the bot sends to Discord.
# Test: uvx --from semgrep semgrep --test --config .semgrep/rules .semgrep/tests
rules:
  - id: no-secrets-in-logs
    languages: [python]
    severity: ERROR
    message: >-
      A token reaches a log call, print, an exception message, or a Discord message. Those
      must never carry it (CLAUDE.md). Log a fact about it instead (that it's set, its
      length), never the value.
    metadata:
      category: security
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
      confidence: HIGH
      references:
        - https://github.com/thechainercygnus/forever-scheduler/issues/3
    mode: taint
    pattern-sources:
      # The Discord bot token and the planner token are SecretStr settings (config.py):
      # their values are secrets.
      - pattern: $SECRET.get_secret_value()
    pattern-sinks:
      # logging.info(...), logger.warning(...), log.exception(...) and the like.
      - patterns:
          - pattern-either:
              - pattern: logging.$LEVEL(...)
              - pattern: $LOGGER.$LEVEL(...)
          - metavariable-regex:
              metavariable: $LEVEL
              regex: ^(debug|info|warning|warn|error|exception|critical|fatal|log)$
      - pattern: print(...)
      # A raised exception's message: it reaches logs and can reach a reply.
      - patterns:
          - pattern-inside: raise $EXC(...)
          - pattern: $EXC(...)
      # What the bot says in Discord: replies, follow-ups and messages.
      - patterns:
          - pattern-either:
              - pattern: $CTX.respond(...)
              - pattern: $CTX.respond_with_modal(...)
              - pattern: $X.create_message(...)
              - pattern: $X.edit_message(...)
              - pattern: $X.send(...)
    pattern-sanitizers:
      # Facts about a secret, not the secret.
      - pattern: len(...)
      - pattern: bool(...)
      # A response's status code: the answer to a request that sent a secret is tainted,
      # but its status is a number from the server and can't carry the secret.
      - pattern: $RESPONSE.status_code
